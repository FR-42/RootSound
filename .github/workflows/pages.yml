name: Publish RootSound website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'web/**'
      - 'src/workstation/**'
      - 'public/instruments/rootsound-studio-v1/**'
      - 'scripts/build-web-demo.mjs'
      - 'vite.web.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build website and reduced music editor
        run: npm run build:website
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .cache/website
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
